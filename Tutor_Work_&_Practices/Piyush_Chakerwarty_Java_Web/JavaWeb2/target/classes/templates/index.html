<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="app-container">
    <header class="app-header">
        <h1>Quick Notes</h1>
        <p>Capture, organize, and manage your ideas instantly.</p>
    </header>

    <!-- Flash Messages -->
    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}"></span>
    </div>
    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>

    <section class="form-section">
        <div class="glass-panel">
            <h2>Create Note</h2>
            <form th:action="@{/notes}" method="post" th:object="${newNote}" class="note-form">
                <div class="form-row">
                    <div class="form-group flex-2">
                        <label for="title">Title <span class="required">*</span></label>
                        <input type="text" id="title" th:field="*{title}" placeholder="Note title..." required
                               maxlength="100">
                    </div>
                    <div class="form-group flex-1">
                        <label for="category">Category</label>
                        <select id="category" th:field="*{category}">
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="Urgent">Urgent</option>
                            <option value="Idea">Idea</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="content">Content <span class="required">*</span></label>
                    <textarea id="content" th:field="*{content}" rows="4" placeholder="What's on your mind?"
                              required maxlength="1000"></textarea>
                </div>

                <button type="submit" class="btn-primary">
                    <span>Save Note</span>
                </button>
            </form>
        </div>
    </section>

    <section class="notes-section">
        <div th:if="${notes.empty}" class="empty-state">
            <div class="empty-icon">📝</div>
            <h3>No notes yet</h3>
            <p>Add your first note above to get started!</p>
        </div>

        <div th:unless="${notes.empty}" class="notes-grid" th:inline="none">
            <div th:each="note : ${notes}" class="note-card glass-panel"
                 th:classappend="'category-' + ${#strings.toLowerCase(note.category)}">
                <div class="note-header">
                    <span class="note-category" th:text="${note.category}"></span>
                    <span class="note-date"
                          th:text="${#temporals.format(note.createdAt, 'MMM dd, yyyy HH:mm')}"></span>
                </div>
                <h3 class="note-title" th:text="${note.title}"></h3>
                <p class="note-content" th:text="${note.content}"></p>

                <div class="note-actions">
                    <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post">
                        <button type="submit" class="btn-delete" title="Delete note">
                            🗑️ Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>
</body>

</html>
